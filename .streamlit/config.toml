# Configuración de Streamlit (local y Streamlit Community Cloud).

[browser]
# Sin estadísticas de uso hacia Streamlit: la app promete no registrar nada.
gatherUsageStats = false

[server]
# MB. Un condicionado completo pesa 1-5 MB; esto deja margen sin abrir la puerta a archivos enormes.
maxUploadSize = 20

[theme]
# La paleta clara de ¿Qué Cubre? (la misma de la app de Android): fondo crema, tarjetas blancas,
# azul como acción. Contrastes medidos en pruebas/medir_contraste.py.
base = "light"
primaryColor = "#2D6BE5"
backgroundColor = "#FBF7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2E2620"
font = "sans serif"
# Con el fondo secundario blanco, las cajas de texto y los selectores sobre las tarjetas blancas
# necesitan un borde para verse.
showWidgetBorder = true
borderColor = "#E8DFD4"
# El aviso amarillo (bloque de B4, red de seguridad, aviso del mapa): el ámbar de «con límites» un poco más
# oscuro, porque el fondo amarillo del aviso lo dejaba en 4,36:1 (pruebas/medir_contraste.py).
yellowTextColor = "#9A5C00"

[client]
# Sin el botón "Deploy" ni el menú de desarrollo en la app publicada.
toolbarMode = "viewer"
