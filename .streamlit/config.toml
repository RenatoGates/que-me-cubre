# Configuración de Streamlit (local y Streamlit Community Cloud).

[browser]
# Sin estadísticas de uso hacia Streamlit: la app promete no registrar nada.
gatherUsageStats = false

[server]
# MB. Un condicionado completo pesa 1-5 MB; esto deja margen sin abrir la puerta a archivos enormes.
maxUploadSize = 20

[theme]
# Índigo como identidad: fondo azulado, contenido en tarjetas blancas (CSS en app/app.py).
primaryColor = "#4338CA"
backgroundColor = "#EDF0FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#161A2E"
font = "sans serif"
# Con el fondo secundario blanco, las cajas de texto y los selectores sobre las tarjetas blancas
# necesitan un borde para verse.
showWidgetBorder = true
borderColor = "#C9CEE6"
# El texto amarillo por defecto (#926C05) queda en 4,4:1 sobre este fondo, bajo el 4,5:1 de WCAG AA;
# un poco más oscuro llega a 5,1:1. Lo usan el bloque de B4, la red de seguridad y el aviso del mapa.
yellowTextColor = "#85620A"

[client]
# Sin el botón "Deploy" ni el menú de desarrollo en la app publicada.
toolbarMode = "viewer"
